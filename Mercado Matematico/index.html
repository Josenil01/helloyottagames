<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/game-viewport.css" />
    <title>Mercado Matemágico</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(160deg, #6ce67d 0%, #01bebc 100%);
            color: #0d3b1e;
            overflow: hidden;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }

        .screen { display: none; flex-direction: column; align-items: center; height: 100%; }
        .screen.active { display: flex; }

        h1.font-game { font-size: clamp(1.5rem, 6vw, 2.3rem); color: #fff; text-shadow: 2px 2px 0 rgba(0,0,0,0.2); margin: 10px 0 0; text-align: center; }
        h2.font-game { font-size: clamp(1.1rem, 4vw, 1.6rem); color: #fff; margin: 10px 0; text-align: center; }

        .btn-large {
            background: var(--hy-purple);
            color: #fff;
            border: none;
            padding: 14px 38px;
            border-radius: 50px;
            font-size: 1.3rem;
            font-family: 'Luckiest Guy', cursive;
            letter-spacing: 0.03em;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--hy-purple-dark);
            margin: 10px 0;
        }
        .btn-large:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--hy-purple-dark); }
        .btn-large:disabled { background: #9aa5a0; box-shadow: 0 6px 0 #6d756f; cursor: not-allowed; opacity: 0.7; }
        .btn-large:disabled:active { transform: none; box-shadow: 0 6px 0 #6d756f; }

        #total-stars { font-size: 1.1rem; font-weight: 800; color: #fff; }

        /* ---- Tela de trilhas ---- */
        #screen-tracks { justify-content: flex-start; padding-top: 30px; overflow-y: auto; }
        .tracks-hud { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 10px; }
        .stat-badge {
            background: #fff; color: #0d3b1e; border: 2px solid #0d3b1e;
            padding: 6px 16px; border-radius: 999px; font-weight: 800; cursor: pointer;
        }
        #track-grid { width: 100%; margin-top: 10px; padding-bottom: 20px; }

        /* ---- Tela de jogo ---- */
        #screen-game { justify-content: flex-start; padding-top: clamp(50px, 8vh, 68px); overflow-y: auto; }
        .game-back-btn {
            position: absolute; top: 16px; left: 16px; z-index: 40;
            background: #fff; border: 2px solid #0d3b1e; color: #0d3b1e;
            width: 40px; height: 40px; border-radius: 50%; font-size: 1.1rem; cursor: pointer;
        }

        .instruction {
            font-weight: 800;
            font-size: clamp(0.9rem, 3.3vw, 1.15rem);
            text-align: center;
            margin-bottom: 14px;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.15);
            color: #fff;
        }

        /* ---- Desafio "Mercado" (comprar / nao comprar) ---- */
        .market-challenge { display: none; width: 100%; max-width: 820px; margin: 0 auto; padding-bottom: 20px; }
        .market-challenge.active { display: flex; }

        .game-layout {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 18px;
            align-items: flex-start;
            justify-content: center;
            width: 100%;
        }

        .market-main {
            flex: 1 1 460px;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .product-tray, .buy-zone-items {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            min-height: 96px;
        }
        .product-tray {
            width: 100%;
            background: rgba(255,255,255,0.2);
            border-radius: 18px;
            padding: 12px;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: #fff;
            border-radius: 14px;
            padding: 8px 10px;
            box-shadow: 0 3px 0 rgba(0,0,0,0.15);
            cursor: grab;
            touch-action: none;
        }
        .product-card.selected { box-shadow: 0 0 0 3px var(--hy-purple), 0 3px 0 rgba(0,0,0,0.15); }
        .product-card.dragging { opacity: 0.35; }
        .product-icon { font-size: clamp(1.5rem, 5.5vw, 2rem); }
        .product-price { font-size: 0.75rem; font-weight: 800; color: #0d3b1e; }
        .product-card.drag-ghost {
            position: fixed; top: 0; left: 0;
            transform: translate(-50%, -50%) scale(1.08);
            pointer-events: none; z-index: 9999;
            box-shadow: 0 10px 24px rgba(0,0,0,0.35);
        }

        .buy-zones {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 12px;
            width: 100%;
            justify-content: center;
        }
        .buy-zone {
            flex: 1 1 200px;
            min-width: 180px;
            border-radius: 18px;
            padding: 10px;
            border: 3px dashed rgba(255,255,255,0.6);
        }
        .buy-zone.drag-over { border-style: solid; background: rgba(255,255,255,0.25); }
        .zone-label { font-weight: 800; color: #fff; text-align: center; font-size: 0.85rem; margin-bottom: 6px; }

        .balance-panel {
            flex: 0 1 180px;
            min-width: 150px;
            background: #fff;
            border-radius: 20px;
            padding: 16px;
            text-align: center;
        }
        .balance-label { font-weight: 800; color: #0d3b1e; font-size: 0.9rem; margin-bottom: 6px; }
        .balance-value { font-family: 'Luckiest Guy', cursive; font-size: clamp(1.3rem, 5vw, 1.8rem); }
        .balance-value.positive { color: var(--hy-green); }
        .balance-value.negative { color: var(--hy-red); }

        /* ---- Desafio "Tabela de Troco" ---- */
        .troco-challenge { display: none; flex-direction: column; align-items: center; gap: 16px; width: 100%; max-width: 640px; margin: 0 auto; padding-bottom: 20px; }
        .troco-challenge.active { display: flex; }

        .troco-catalog {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            background: rgba(255,255,255,0.2);
            border-radius: 18px;
            padding: 12px;
            width: 100%;
        }
        .catalog-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .catalog-icon { font-size: clamp(1.6rem, 6vw, 2.1rem); }
        .catalog-price { font-size: 0.8rem; font-weight: 800; color: #fff; }

        .troco-table { width: 100%; background: #fff; border-radius: 18px; overflow: hidden; }
        .troco-row {
            display: grid;
            grid-template-columns: 1.3fr 1fr 1fr;
            align-items: center;
            gap: 6px;
            padding: 10px 12px;
            border-bottom: 1px solid #e5e5e5;
            font-size: clamp(0.75rem, 2.6vw, 0.95rem);
        }
        .troco-row:last-child { border-bottom: none; }
        .troco-header { font-weight: 800; color: #0d3b1e; background: #f3f3f3; }
        .troco-icons { font-size: clamp(1.1rem, 4vw, 1.4rem); text-align: center; }
        .troco-value { font-weight: 800; color: #0d3b1e; text-align: center; }
        .troco-input {
            width: 100%;
            text-align: center;
            font-size: clamp(0.85rem, 3vw, 1rem);
            font-weight: 800;
            padding: 6px 4px;
            border: 2px solid #ccc;
            border-radius: 10px;
            font-family: inherit;
        }
        .troco-input.state-correct { border-color: var(--hy-green); background: #eafff0; }
        .troco-input.state-wrong { border-color: var(--hy-red); background: #ffecec; }

        /* ---- Modal ---- */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.65);
            display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal-content {
            background: #fff; padding: 30px; border-radius: 30px; text-align: center;
            max-width: 340px; width: 90%; color: #1a1a1a;
        }
        .modal-content h2 { font-family: 'Luckiest Guy', cursive; color: #0d3b1e; font-size: 1.3rem; }
    </style>
</head>
<body>

    <div class="container">

        <!-- TELA INICIAL -->
        <div id="screen-cover" class="screen active">
            <button onclick="window.location.href='../index.html'" class="btn-back">← Voltar</button>
            <div style="flex-grow:1; display:flex; flex-direction:column; align-items:center; justify-content:center;">
                <div style="font-size:4rem;">🛒</div>
                <h1 class="font-game">Mercado Matemágico</h1>
                <h2 class="font-game">Compre com sabedoria!</h2>
                <button class="btn-large" onclick="changeScreen('tracks')">COMEÇAR</button>
                <p id="total-stars">⭐ 0/36</p>
            </div>
        </div>

        <!-- TELA DE TRILHAS -->
        <div id="screen-tracks" class="screen">
            <div class="tracks-hud">
                <button aria-label="Voltar" title="Voltar" class="stat-badge" onclick="changeScreen('cover')">← Voltar</button>
                <div class="stat-badge" id="tracks-star-count">⭐ 0</div>
            </div>
            <h2 class="font-game">Escolha sua trilha</h2>
            <div id="track-grid"></div>
        </div>

        <!-- TELA DE JOGO -->
        <div id="screen-game" class="screen">
            <button aria-label="Voltar" title="Voltar" class="game-back-btn" onclick="changeScreen('tracks')">←</button>

            <div class="instruction" id="instruction"></div>

            <div class="market-challenge" id="market-challenge">
                <div class="game-layout">
                    <div class="market-main">
                        <div class="product-tray" id="product-tray" data-zone="tray" onclick="handleZoneClick('tray')"></div>

                        <div class="buy-zones">
                            <div class="buy-zone" id="zone-comprar" data-zone="comprar" onclick="handleZoneClick('comprar')">
                                <div class="zone-label">Podemos comprar</div>
                                <div class="buy-zone-items" id="zone-comprar-items"></div>
                            </div>
                            <div class="buy-zone" id="zone-naocomprar" data-zone="naocomprar" onclick="handleZoneClick('naocomprar')">
                                <div class="zone-label">Não podemos comprar</div>
                                <div class="buy-zone-items" id="zone-naocomprar-items"></div>
                            </div>
                        </div>

                        <button class="btn-large" id="verify-market-btn" onclick="verifyMarket()">VERIFICAR</button>
                    </div>

                    <div class="balance-panel">
                        <div class="balance-label">Saldo</div>
                        <div class="balance-value" id="balance-value">R$ 0</div>
                    </div>
                </div>
            </div>

            <div class="troco-challenge" id="troco-challenge">
                <div class="troco-catalog" id="troco-catalog"></div>
                <div class="troco-table" id="troco-table"></div>
                <button class="btn-large" onclick="verifyTroco()">VERIFICAR</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE RESULTADO -->
    <div class="modal" id="result-modal">
        <div class="modal-content">
            <h2>Parabéns, você dominou o mercado!</h2>
            <div id="result-stars" style="font-size: 2.5rem; margin: 15px 0;">⭐⭐⭐</div>
            <button class="btn-large" onclick="handleModalContinue()">CONTINUAR</button>
        </div>
    </div>

    <script src="../utils/audio.js"></script>
    <script src="../utils/score.js"></script>
    <script src="../utils/elapsed.js"></script>
    <script src="../utils/progress.js"></script>
    <script src="../utils/stars.js"></script>
    <script src="../utils/shuffle.js"></script>
    <script src="../utils/rand.js"></script>
    <script src="main.js"></script>
</body>
</html>
