<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/game-viewport.css" />
    <title>Complete a Sequência</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(160deg, #0a40b5 0%, #6ce67d 100%);
            color: #fff;
            overflow: hidden;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }

        .screen { display: none; flex-direction: column; align-items: center; height: 100%; }
        .screen.active { display: flex; }

        h1.font-game { font-size: clamp(1.4rem, 6vw, 2.2rem); color: #fff; text-shadow: 2px 2px 0 rgba(0,0,0,0.25); margin: 10px 0 0; text-align: center; }
        h2.font-game { font-size: clamp(1.05rem, 4vw, 1.5rem); color: #fff; margin: 10px 0; text-align: center; }

        .btn-large {
            background: var(--hy-orange);
            color: #fff;
            border: none;
            padding: 14px 38px;
            border-radius: 50px;
            font-size: 1.3rem;
            font-family: 'Luckiest Guy', cursive;
            letter-spacing: 0.03em;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--hy-orange-dark);
            margin: 10px 0;
        }
        .btn-large:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--hy-orange-dark); }

        #total-stars { font-size: 1.1rem; font-weight: 800; color: #fff; }

        /* ---- Tela de trilhas ---- */
        #screen-tracks { justify-content: flex-start; padding-top: 30px; overflow-y: auto; }
        .tracks-hud { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 10px; }
        .stat-badge {
            background: #fff; color: #0a40b5; border: 2px solid #0a40b5;
            padding: 6px 16px; border-radius: 999px; font-weight: 800; cursor: pointer;
        }
        #track-grid { width: 100%; margin-top: 10px; padding-bottom: 20px; }

        /* ---- Tela de jogo ---- */
        #screen-game { justify-content: flex-start; padding-top: clamp(40px, 5vh, 56px); overflow-y: auto; }
        .game-back-btn {
            position: absolute; top: 16px; left: 16px; z-index: 40;
            background: #fff; border: 2px solid #0a40b5; color: #0a40b5;
            width: 40px; height: 40px; border-radius: 50%; font-size: 1.1rem; cursor: pointer;
        }

        .game-content { display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%; min-height: 0; }

        .instruction {
            flex: 0 0 auto;
            font-weight: 800;
            font-size: clamp(0.85rem, 3.2vw, 1.1rem);
            text-align: center;
            margin-bottom: 14px;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.15);
        }

        .sequence-wrap {
            flex: 1 1 auto;
            width: 100%;
            max-width: 720px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sequence-row {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }

        .seq-cell {
            width: clamp(46px, 12vw, 62px);
            height: clamp(46px, 12vw, 62px);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            color: #0a40b5;
            border-radius: 14px;
            font-family: 'Luckiest Guy', cursive;
            font-size: clamp(1.1rem, 4vw, 1.5rem);
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
        }

        .seq-input {
            width: clamp(46px, 12vw, 62px);
            height: clamp(46px, 12vw, 62px);
            text-align: center;
            font-family: 'Luckiest Guy', cursive;
            font-size: clamp(1.1rem, 4vw, 1.5rem);
            border-radius: 14px;
            border: 3px dashed #fff;
            background: rgba(255,255,255,0.2);
            color: #fff;
        }
        .seq-input::placeholder { color: rgba(255,255,255,0.6); }
        .seq-input.state-correct { border-style: solid; border-color: var(--hy-green); background: #fff; color: #0a40b5; }
        .seq-input.state-wrong { border-style: solid; border-color: var(--hy-red); }

        .controls-bar {
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
            padding: 14px 0;
        }

        /* ---- Modal ---- */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.65);
            display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal-content {
            background: #fff; padding: 30px; border-radius: 30px; text-align: center;
            max-width: 340px; width: 90%; color: #1a1a1a;
        }
        .modal-content h2 { font-family: 'Luckiest Guy', cursive; color: #0a40b5; font-size: 1.3rem; }
    </style>
</head>
<body>

    <div class="container">

        <!-- TELA INICIAL -->
        <div id="screen-cover" class="screen active">
            <button onclick="window.location.href='../index.html'" class="btn-back">← Voltar</button>
            <div style="flex-grow:1; display:flex; flex-direction:column; align-items:center; justify-content:center;">
                <div style="font-size:4rem;">🔢</div>
                <h1 class="font-game">Complete a Sequência</h1>
                <h2 class="font-game">Descubra o padrão e preencha os números que faltam!</h2>
                <button class="btn-large" onclick="changeScreen('tracks')">COMEÇAR</button>
                <p id="total-stars">⭐ 0/36</p>
            </div>
        </div>

        <!-- TELA DE TRILHAS -->
        <div id="screen-tracks" class="screen">
            <div class="tracks-hud">
                <button aria-label="Voltar" title="Voltar" class="stat-badge" onclick="changeScreen('cover')">← Voltar</button>
                <div class="stat-badge" id="tracks-star-count">⭐ 0</div>
            </div>
            <h2 class="font-game">Escolha sua trilha</h2>
            <div id="track-grid"></div>
        </div>

        <!-- TELA DE JOGO -->
        <div id="screen-game" class="screen">
            <button aria-label="Voltar" title="Voltar" class="game-back-btn" onclick="changeScreen('tracks')">←</button>

            <div class="game-content">
                <div class="instruction" id="instruction">Descubra o padrão e complete os números que faltam!</div>

                <div class="sequence-wrap">
                    <div class="sequence-row" id="sequence-row"></div>
                </div>

                <div class="controls-bar">
                    <button class="btn-large" onclick="verifySequence()">VERIFICAR</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE RESULTADO -->
    <div class="modal" id="result-modal">
        <div class="modal-content">
            <h2>Parabéns, você completou a sequência!</h2>
            <div id="result-stars" style="font-size: 2.5rem; margin: 15px 0;">⭐⭐⭐</div>
            <button class="btn-large" onclick="handleModalContinue()">CONTINUAR</button>
        </div>
    </div>

    <script src="../utils/audio.js"></script>
    <script src="../utils/score.js"></script>
    <script src="../utils/elapsed.js"></script>
    <script src="../utils/progress.js"></script>
    <script src="../utils/stars.js"></script>
    <script src="../utils/shuffle.js"></script>
    <script src="../utils/rand.js"></script>
    <script src="main.js"></script>
</body>
</html>
