<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/game-viewport.css" />
    <title>Qual é o próximo</title>
    <style>
        :root {
            --card-bg: #fdf5e6;
            --card-border: #d9b98a;
            --cell-size: clamp(10px, 3vw, 16px);
            --cell-size-mini: clamp(8px, 2.4vw, 13px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, var(--hy-orange) 0%, var(--hy-purple) 100%);
            color: #3a1050;
            overflow: hidden;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }

        .screen { display: none; flex-direction: column; align-items: center; height: 100%; }
        .screen.active { display: flex; }

        h1.font-game { font-size: clamp(1.5rem, 6vw, 2.3rem); color: #fff; text-shadow: 2px 2px 0 rgba(0,0,0,0.2); margin: 10px 0 0; text-align: center; }
        h2.font-game { font-size: clamp(1.1rem, 4vw, 1.6rem); color: #fff; margin: 10px 0; text-align: center; }

        .btn-large {
            background: var(--hy-teal);
            color: #fff;
            border: none;
            padding: 14px 38px;
            border-radius: 50px;
            font-size: 1.4rem;
            font-family: 'Luckiest Guy', cursive;
            letter-spacing: 0.03em;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--hy-teal-dark);
            margin: 14px 0;
        }
        .btn-large:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--hy-teal-dark); }

        #total-stars { font-size: 1.1rem; font-weight: 800; color: #fff; }

        /* ---- Tela de trilhas ---- */
        #screen-tracks { justify-content: flex-start; padding-top: 30px; overflow-y: auto; }
        .tracks-hud { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 10px; }
        .stat-badge {
            background: #fff; color: var(--hy-purple); border: 2px solid var(--hy-purple);
            padding: 6px 16px; border-radius: 999px; font-weight: 800; cursor: pointer;
        }
        #track-grid { width: 100%; margin-top: 10px; padding-bottom: 20px; }

        /* ---- Tela de jogo ---- */
        #screen-game { justify-content: flex-start; padding-top: clamp(50px, 8vh, 68px); overflow-y: auto; }
        .game-back-btn {
            position: absolute; top: 16px; left: 16px; z-index: 40;
            background: #fff; border: 2px solid var(--hy-purple); color: var(--hy-purple);
            width: 40px; height: 40px; border-radius: 50%; font-size: 1.1rem; cursor: pointer;
        }

        .instruction {
            color: #fff;
            font-weight: 800;
            font-size: clamp(0.95rem, 3.5vw, 1.2rem);
            text-align: center;
            margin-bottom: 16px;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.15);
        }

        .game-layout {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            padding-bottom: 20px;
        }

        /* ---- Fileira da sequencia ---- */
        .sequence-row {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
            margin-bottom: 22px;
        }
        .sequence-card {
            background: var(--card-bg);
            border: 3px solid var(--card-border);
            border-radius: 14px;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sequence-card.placeholder {
            width: clamp(50px, 14vw, 70px);
            height: clamp(50px, 14vw, 70px);
            border-style: dashed;
            font-family: 'Luckiest Guy', cursive;
            font-size: clamp(1.6rem, 6vw, 2.2rem);
            color: var(--hy-purple);
        }

        /* ---- Opcoes de resposta ---- */
        .options-row {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
        }
        .option-card {
            background: var(--card-bg);
            border: 3px solid var(--card-border);
            border-radius: 16px;
            padding: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .option-card:active { transform: scale(0.96); }
        .option-card.state-correct { border-color: var(--hy-green); background: #eafff0; }
        .option-card.wrong-disabled { opacity: 0.3; pointer-events: none; }

        /* ---- Grid de forma (reaproveitado do Espelho Magico) ---- */
        .shape-grid { display: grid; gap: 2px; }
        .shape-grid.mini { --cell-size: var(--cell-size-mini); }
        .shape-cell { width: var(--cell-size); height: var(--cell-size); border-radius: 3px; box-sizing: border-box; }
        .shape-cell.empty { background: transparent; }
        .shape-cell.filled { border: 1px solid rgba(0,0,0,0.15); }

        /* ---- Modal ---- */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.65);
            display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal-content {
            background: #fff; padding: 30px; border-radius: 30px; text-align: center;
            max-width: 340px; width: 90%;
        }
        .modal-content h2 { font-family: 'Luckiest Guy', cursive; color: var(--hy-purple); font-size: 1.3rem; }
    </style>
</head>
<body>

    <div class="container">

        <!-- TELA INICIAL -->
        <div id="screen-cover" class="screen active">
            <button onclick="window.location.href='../index.html'" class="btn-back">← Voltar</button>
            <div style="flex-grow:1; display:flex; flex-direction:column; align-items:center; justify-content:center;">
                <div style="font-size:4rem;">🔮</div>
                <h1 class="font-game">Qual é o próximo</h1>
                <h2 class="font-game">Descubra o padrão da sequência!</h2>
                <button class="btn-large" onclick="changeScreen('tracks')">COMEÇAR</button>
                <p id="total-stars">⭐ 0/36</p>
            </div>
        </div>

        <!-- TELA DE TRILHAS -->
        <div id="screen-tracks" class="screen">
            <div class="tracks-hud">
                <button aria-label="Voltar" title="Voltar" class="stat-badge" onclick="changeScreen('cover')">← Voltar</button>
                <div class="stat-badge" id="tracks-star-count">⭐ 0</div>
            </div>
            <h2 class="font-game">Escolha sua trilha</h2>
            <div id="track-grid"></div>
        </div>

        <!-- TELA DE JOGO -->
        <div id="screen-game" class="screen">
            <button aria-label="Voltar" title="Voltar" class="game-back-btn" onclick="changeScreen('tracks')">←</button>

            <div class="instruction">Observe o giro das cores e escolha o próximo!</div>

            <div class="game-layout">
                <div class="sequence-row" id="sequence-row"></div>
                <div class="options-row" id="options-row"></div>
            </div>
        </div>
    </div>

    <!-- MODAL DE RESULTADO -->
    <div class="modal" id="result-modal">
        <div class="modal-content">
            <h2>Parabéns, você descobriu o padrão!</h2>
            <div id="result-stars" style="font-size: 2.5rem; margin: 15px 0;">⭐⭐⭐</div>
            <button class="btn-large" onclick="handleModalContinue()">CONTINUAR</button>
        </div>
    </div>

    <script src="../utils/audio.js"></script>
    <script src="../utils/score.js"></script>
    <script src="../utils/elapsed.js"></script>
    <script src="../utils/progress.js"></script>
    <script src="../utils/stars.js"></script>
    <script src="../utils/shuffle.js"></script>
    <script src="../utils/rand.js"></script>
    <script src="main.js"></script>
</body>
</html>
