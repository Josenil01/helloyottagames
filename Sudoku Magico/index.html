<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/game-viewport.css" />
    <title>Sudoku Mágico</title>
    <style>
        :root {
            --cell-size: clamp(34px, 8vw, 54px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(160deg, #48076a 0%, #d046d9 100%);
            color: #fff;
            overflow: hidden;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }

        .screen { display: none; flex-direction: column; align-items: center; height: 100%; }
        .screen.active { display: flex; }

        h1.font-game { font-size: clamp(1.5rem, 6vw, 2.3rem); color: #fff; text-shadow: 2px 2px 0 rgba(0,0,0,0.25); margin: 10px 0 0; text-align: center; }
        h2.font-game { font-size: clamp(1.1rem, 4vw, 1.6rem); color: #fff; margin: 10px 0; text-align: center; }

        .btn-large {
            background: var(--hy-orange);
            color: #fff;
            border: none;
            padding: 14px 38px;
            border-radius: 50px;
            font-size: 1.4rem;
            font-family: 'Luckiest Guy', cursive;
            letter-spacing: 0.03em;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--hy-orange-dark);
            margin: 10px 0;
        }
        .btn-large:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--hy-orange-dark); }

        #total-stars { font-size: 1.1rem; font-weight: 800; color: #fff; }

        /* ---- Tela de trilhas ---- */
        #screen-tracks { justify-content: flex-start; padding-top: 30px; overflow-y: auto; }
        .tracks-hud { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 10px; }
        .stat-badge {
            background: #fff; color: #48076a; border: 2px solid #48076a;
            padding: 6px 16px; border-radius: 999px; font-weight: 800; cursor: pointer;
        }
        #track-grid { width: 100%; margin-top: 10px; padding-bottom: 20px; }

        /* ---- Tela de jogo ---- */
        #screen-game { justify-content: flex-start; padding-top: clamp(50px, 8vh, 68px); overflow-y: auto; }
        .game-back-btn {
            position: absolute; top: 16px; left: 16px; z-index: 40;
            background: #fff; border: 2px solid #48076a; color: #48076a;
            width: 40px; height: 40px; border-radius: 50%; font-size: 1.1rem; cursor: pointer;
        }

        .instruction {
            font-weight: 800;
            font-size: clamp(0.95rem, 3.5vw, 1.2rem);
            text-align: center;
            margin-bottom: 16px;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
        }

        .game-layout { width: 100%; max-width: 700px; margin: 0 auto; padding-bottom: 20px; display: flex; flex-direction: column; align-items: center; }

        #sudoku-grid {
            display: grid;
            background: transparent;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            gap: 2px;
        }

        .sudoku-cell {
            width: var(--cell-size);
            height: var(--cell-size);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(var(--cell-size) * 0.5);
            font-weight: 800;
            color: #3a1050;
            border-radius: 4px;
            background: rgba(255,255,255,0.12);
        }
        .sudoku-cell.given { background: #fdf5e6; }
        .sudoku-cell.filled { background: #eafff0; }
        .sudoku-cell.blank {
            background: rgba(255,255,255,0.08);
            border: 2px dashed rgba(255,255,255,0.4);
            cursor: pointer;
        }
        .sudoku-cell.blank.selected { border-color: var(--hy-orange); box-shadow: 0 0 0 3px rgba(255,168,0,0.5); }
        .sudoku-cell.box-right { border-right: 3px solid rgba(255,255,255,0.3); }
        .sudoku-cell.box-bottom { border-bottom: 3px solid rgba(255,255,255,0.3); }

        /* Setas mostrando o sentido de "nao pode repetir" — uma pra direita
           por linha, uma pra baixo por coluna. Ficam em faixas extras do
           mesmo grid, entao alinham perfeitamente com linhas/colunas. */
        .line-arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: calc(var(--cell-size) * 0.5);
            pointer-events: none;
        }
        .line-arrow.col-arrow { transform: rotate(90deg); }

        /* ---- Bandeja de simbolos ---- */
        #symbol-tray {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 40px;
        }
        .symbol-swatch {
            width: clamp(42px, 9vw, 58px);
            height: clamp(42px, 9vw, 58px);
            border-radius: 14px;
            background: #fdf5e6;
            border: 3px solid #d9b98a;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.3rem, 5vw, 1.9rem);
            font-weight: 800;
            color: #3a1050;
            cursor: grab;
            touch-action: none;
        }
        .symbol-swatch.selected { border-color: var(--hy-orange); box-shadow: 0 0 0 3px rgba(255,168,0,0.5); }
        .symbol-swatch.dragging { opacity: 0.35; }
        .symbol-swatch.drag-ghost {
            position: fixed;
            top: 0; left: 0;
            transform: translate(-50%, -50%) scale(1.1);
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 10px 24px rgba(0,0,0,0.35);
        }

        /* ---- Modal ---- */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.65);
            display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal-content {
            background: #fff; padding: 30px; border-radius: 30px; text-align: center;
            max-width: 340px; width: 90%; color: #1a1a1a;
        }
        .modal-content h2 { font-family: 'Luckiest Guy', cursive; color: #48076a; font-size: 1.3rem; }
    </style>
</head>
<body>

    <div class="container">

        <!-- TELA INICIAL -->
        <div id="screen-cover" class="screen active">
            <button onclick="window.location.href='../index.html'" class="btn-back">← Voltar</button>
            <div style="flex-grow:1; display:flex; flex-direction:column; align-items:center; justify-content:center;">
                <div style="font-size:4rem;">🧩</div>
                <h1 class="font-game">Sudoku Mágico</h1>
                <h2 class="font-game">Complete o quebra-cabeça!</h2>
                <button class="btn-large" onclick="changeScreen('tracks')">COMEÇAR</button>
                <p id="total-stars">⭐ 0/36</p>
            </div>
        </div>

        <!-- TELA DE TRILHAS -->
        <div id="screen-tracks" class="screen">
            <div class="tracks-hud">
                <button aria-label="Voltar" title="Voltar" class="stat-badge" onclick="changeScreen('cover')">← Voltar</button>
                <div class="stat-badge" id="tracks-star-count">⭐ 0</div>
            </div>
            <h2 class="font-game">Escolha sua trilha</h2>
            <div id="track-grid"></div>
        </div>

        <!-- TELA DE JOGO -->
        <div id="screen-game" class="screen">
            <button aria-label="Voltar" title="Voltar" class="game-back-btn" onclick="changeScreen('tracks')">←</button>

            <div class="instruction" id="instruction">Complete o Sudoku!</div>

            <div class="game-layout">
                <div id="sudoku-grid"></div>
                <div id="symbol-tray"></div>
            </div>
        </div>
    </div>

    <!-- MODAL DE RESULTADO -->
    <div class="modal" id="result-modal">
        <div class="modal-content">
            <h2>Parabéns, você resolveu o Sudoku!</h2>
            <div id="result-stars" style="font-size: 2.5rem; margin: 15px 0;">⭐⭐⭐</div>
            <button class="btn-large" onclick="handleModalContinue()">CONTINUAR</button>
        </div>
    </div>

    <script src="../utils/audio.js"></script>
    <script src="../utils/score.js"></script>
    <script src="../utils/elapsed.js"></script>
    <script src="../utils/progress.js"></script>
    <script src="../utils/stars.js"></script>
    <script src="../utils/shuffle.js"></script>
    <script src="../utils/rand.js"></script>
    <script src="main.js"></script>
</body>
</html>
