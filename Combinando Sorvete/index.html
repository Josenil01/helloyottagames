<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/game-viewport.css" />
    <title>Combinando Sorvete</title>
    <style>
        :root {
            --scoop-size: clamp(30px, 7vw, 44px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(160deg, #ffa800 0%, #ff3041 100%);
            color: #fff;
            overflow: hidden;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }

        .screen { display: none; flex-direction: column; align-items: center; height: 100%; }
        .screen.active { display: flex; }

        h1.font-game { font-size: clamp(1.5rem, 6vw, 2.3rem); color: #fff; text-shadow: 2px 2px 0 rgba(0,0,0,0.25); margin: 10px 0 0; text-align: center; }
        h2.font-game { font-size: clamp(1.1rem, 4vw, 1.6rem); color: #fff; margin: 10px 0; text-align: center; }

        .btn-large {
            background: var(--hy-purple);
            color: #fff;
            border: none;
            padding: 14px 38px;
            border-radius: 50px;
            font-size: 1.4rem;
            font-family: 'Luckiest Guy', cursive;
            letter-spacing: 0.03em;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--hy-purple-dark);
            margin: 10px 0;
        }
        .btn-large:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--hy-purple-dark); }

        #total-stars { font-size: 1.1rem; font-weight: 800; color: #fff; }

        /* ---- Tela de trilhas ---- */
        #screen-tracks { justify-content: flex-start; padding-top: 30px; overflow-y: auto; }
        .tracks-hud { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 10px; }
        .stat-badge {
            background: #fff; color: #ff3041; border: 2px solid #ff3041;
            padding: 6px 16px; border-radius: 999px; font-weight: 800; cursor: pointer;
        }
        #track-grid { width: 100%; margin-top: 10px; padding-bottom: 20px; }

        /* ---- Tela de jogo ---- */
        #screen-game { justify-content: flex-start; padding-top: clamp(50px, 8vh, 68px); overflow-y: auto; }
        .game-back-btn {
            position: absolute; top: 16px; left: 16px; z-index: 40;
            background: #fff; border: 2px solid #ff3041; color: #ff3041;
            width: 40px; height: 40px; border-radius: 50%; font-size: 1.1rem; cursor: pointer;
        }

        .instruction {
            font-weight: 800;
            font-size: clamp(0.95rem, 3.5vw, 1.2rem);
            text-align: center;
            margin-bottom: 16px;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
        }

        .game-layout { width: 100%; max-width: 780px; margin: 0 auto; padding-bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 22px; }

        /* ---- Caixa de sabores ---- */
        #flavor-box {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            background: rgba(255,255,255,0.15);
            border-radius: 18px;
            padding: 14px;
        }
        .flavor-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: grab;
            touch-action: none;
        }
        .flavor-card.selected .flavor-scoop { box-shadow: 0 0 0 3px var(--hy-purple), 0 3px 0 rgba(0,0,0,0.25); }
        .flavor-card.dragging { opacity: 0.35; }
        .flavor-scoop {
            width: var(--scoop-size);
            height: var(--scoop-size);
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.85);
            box-shadow: 0 3px 0 rgba(0,0,0,0.2);
        }
        .flavor-scoop.drag-ghost {
            position: fixed; top: 0; left: 0;
            transform: translate(-50%, -50%) scale(1.1);
            pointer-events: none; z-index: 9999;
            box-shadow: 0 10px 24px rgba(0,0,0,0.35);
        }
        .flavor-label { font-size: 0.7rem; font-weight: 800; text-shadow: 1px 1px 0 rgba(0,0,0,0.2); }

        /* ---- Cones ---- */
        #cones-row {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
        }
        .cone-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 8px;
            border-radius: 14px;
            border: 3px solid transparent;
        }
        .cone-card.locked { border-color: var(--hy-green); background: rgba(108,230,125,0.15); }
        .scoops-stack {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
        }
        .scoop-slot {
            width: var(--scoop-size);
            height: var(--scoop-size);
            border-radius: 50%;
            margin-bottom: calc(var(--scoop-size) * -0.28);
        }
        .scoop-slot.empty { border: 2px dashed rgba(255,255,255,0.5); background: rgba(255,255,255,0.1); }
        .scoop-slot.filled { border: 2px solid rgba(0,0,0,0.2); cursor: pointer; }
        .cone-shape {
            width: calc(var(--scoop-size) * 0.85);
            height: calc(var(--scoop-size) * 1.1);
            background: linear-gradient(160deg, #e8b96a 0%, #c9924a 100%);
            clip-path: polygon(50% 100%, 0% 0%, 100% 0%);
            margin-top: 2px;
        }

        /* ---- Modal ---- */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.65);
            display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal-content {
            background: #fff; padding: 30px; border-radius: 30px; text-align: center;
            max-width: 340px; width: 90%; color: #1a1a1a;
        }
        .modal-content h2 { font-family: 'Luckiest Guy', cursive; color: #ff3041; font-size: 1.3rem; }
    </style>
</head>
<body>

    <div class="container">

        <!-- TELA INICIAL -->
        <div id="screen-cover" class="screen active">
            <button onclick="window.location.href='../index.html'" class="btn-back">← Voltar</button>
            <div style="flex-grow:1; display:flex; flex-direction:column; align-items:center; justify-content:center;">
                <div style="font-size:4rem;">🍦</div>
                <h1 class="font-game">Combinando Sorvete</h1>
                <h2 class="font-game">Monte todas as combinações possíveis!</h2>
                <button class="btn-large" onclick="changeScreen('tracks')">COMEÇAR</button>
                <p id="total-stars">⭐ 0/36</p>
            </div>
        </div>

        <!-- TELA DE TRILHAS -->
        <div id="screen-tracks" class="screen">
            <div class="tracks-hud">
                <button aria-label="Voltar" title="Voltar" class="stat-badge" onclick="changeScreen('cover')">← Voltar</button>
                <div class="stat-badge" id="tracks-star-count">⭐ 0</div>
            </div>
            <h2 class="font-game">Escolha sua trilha</h2>
            <div id="track-grid"></div>
        </div>

        <!-- TELA DE JOGO -->
        <div id="screen-game" class="screen">
            <button aria-label="Voltar" title="Voltar" class="game-back-btn" onclick="changeScreen('tracks')">←</button>

            <div class="instruction" id="instruction">Monte cada cone com 2 bolas de sorvete, sem repetir a combinação!</div>

            <div class="game-layout">
                <div id="cones-row"></div>
                <div id="flavor-box"></div>
            </div>
        </div>
    </div>

    <!-- MODAL DE RESULTADO -->
    <div class="modal" id="result-modal">
        <div class="modal-content">
            <h2>Parabéns, você combinou todos os sabores!</h2>
            <div id="result-stars" style="font-size: 2.5rem; margin: 15px 0;">⭐⭐⭐</div>
            <button class="btn-large" onclick="handleModalContinue()">CONTINUAR</button>
        </div>
    </div>

    <script src="../utils/audio.js"></script>
    <script src="../utils/score.js"></script>
    <script src="../utils/elapsed.js"></script>
    <script src="../utils/progress.js"></script>
    <script src="../utils/stars.js"></script>
    <script src="../utils/shuffle.js"></script>
    <script src="../utils/rand.js"></script>
    <script src="main.js"></script>
</body>
</html>
