<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/game-viewport.css" />
    <title>Complete a Palavra - Vogais</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Quicksand:wght@500;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            max-width: 100%;
        }
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #e0f2fe;
            background-image: radial-gradient(circle at 50% 50%, #f0f9ff 0%, #bae6fd 100%);
            touch-action: manipulation;
            min-height: 100vh;
        }
        .font-game {
            font-family: 'Luckiest Guy', cursive;
            letter-spacing: 2px;
        }
        .screen {
            display: none;
            min-height: 100vh;
            min-height: 100dvh;
            flex-direction: column;
            align-items: center;
            padding: clamp(1rem, 4vw, 2rem);
            position: relative;
            z-index: 10;
            width: 100%;
        }
        .active-screen {
            display: flex;
        }
        
        /* Animações */
        @keyframes success-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); color: #22c55e; }
            100% { transform: scale(1); }
        }
        .correct-anim {
            animation: success-pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-5deg); color: #ef4444; }
            75% { transform: translateX(10px) rotate(5deg); }
        }
        .shake-anim {
            animation: shake 0.4s ease;
        }

        /* Cartões de Nível */
        .level-card, .mode-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .level-card:not(.locked):hover, .mode-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .locked {
            filter: grayscale(1);
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Estilo dos Botões de Vogais */
        .vowel-btn {
            transition: all 0.1s ease;
            position: relative;
            min-width: 0;
            touch-action: manipulation;
        }
        .vowel-btn:active, .vowel-btn.active-press {
            transform: translateY(6px);
            box-shadow: 0 0px 0 rgba(0,0,0,0) !important;
        }

        /* Bandeirolas de Score */
        .flag {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 50px;
            color: white;
            font-family: 'Luckiest Guy', cursive;
            font-size: 1.5rem;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
        }
        .flag-pole {
            width: 4px;
            height: 70px;
            background-color: #334155;
            position: absolute;
            left: 0;
            top: -10px;
            border-radius: 2px;
        }

        /* Silhueta de Fundo Estilo Parque (Opcional) */
        .bg-silhouette {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40vh;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23bae6fd" fill-opacity="0.5" d="M0,256L48,245.3C96,235,192,213,288,218.7C384,224,480,256,576,261.3C672,267,768,245,864,224C960,203,1056,181,1152,186.7C1248,192,1344,224,1392,240L1440,256L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path><circle cx="300" cy="150" r="100" stroke="%23bae6fd" stroke-width="8" fill="none" opacity="0.5"/><line x1="300" y1="50" x2="300" y2="250" stroke="%23bae6fd" stroke-width="8" opacity="0.5"/><line x1="200" y1="150" x2="400" y2="150" stroke="%23bae6fd" stroke-width="8" opacity="0.5"/><line x1="229" y1="79" x2="371" y2="221" stroke="%23bae6fd" stroke-width="8" opacity="0.5"/><line x1="229" y1="221" x2="371" y2="79" stroke="%23bae6fd" stroke-width="8" opacity="0.5"/></svg>');
            background-size: cover;
            background-position: bottom;
            z-index: 1;
            pointer-events: none;
        }

        #word-gap {
            border-bottom: 6px solid #94a3b8;
            min-width: clamp(35px, 8vw, 50px);
            display: inline-block;
            text-align: center;
        }
    </style>
</head>
<body class="hy-brand">

    <div class="bg-silhouette"></div>

    <!-- TELA INICIAL -->
    <div id="screen-start" class="screen active-screen hy-stage hy-theme-vowel justify-center text-center gap-4">
        <a href="../index.html" class="btn-back" style="color:#334155">← Voltar</a>
        <div class="hy-deco" aria-hidden="true">
            <span style="top:8%;left:6%">🔤</span>
            <span style="top:14%;right:8%">✏️</span>
            <span style="top:54%;left:4%">📚</span>
            <span style="bottom:8%;left:14%">⭐</span>
            <span style="bottom:10%;right:14%">🎈</span>
        </div>
        <span class="hy-badge">🔠 Jogo de Ortografia</span>
        <div class="hy-hero">🎹</div>
        <h1 class="hy-title"><span class="l1">Complete a</span><span class="l2">Palavra</span></h1>
        <p class="hy-tagline">Descubra a vogal que falta e monte a palavra certa!</p>
        <button onclick="showScreen('screen-mode')" class="hy-cta">
            Jogar!
        </button>
    </div>

    <!-- TELA DE SELEÇÃO DE MODO -->
    <div id="screen-mode" class="screen hy-stage hy-theme-vowel justify-center items-center gap-8">
        <h2 class="hy-heading">Como vamos jogar?</h2>
        <div class="flex flex-col md:flex-row gap-8 w-full max-w-3xl px-4">
            <button onclick="setMode('infantil')" class="mode-card hy-panel flex-1" style="--acc:#01bebc;--acc-dark:#008f8e">
                <div class="text-7xl mb-4">👶</div>
                <div class="text-4xl font-game mb-3" style="color:#008f8e">INFANTIL</div>
                <p class="text-gray-500 font-bold text-lg">Letras Grandes<br>(MAIÚSCULAS)</p>
            </button>

            <button onclick="setMode('fundamental')" class="mode-card hy-panel flex-1" style="--acc:#d046d9;--acc-dark:#a030b0">
                <div class="text-7xl mb-4">🎒</div>
                <div class="text-4xl font-game mb-3" style="color:#a030b0">ESCOLA</div>
                <p class="text-gray-500 font-bold text-lg">Maiúsculas e Minúsculas<br>(Pian _)</p>
            </button>
        </div>
        <button onclick="showScreen('screen-start')" class="hy-pill-btn">← Voltar ao início</button>
    </div>

    <!-- TELA DE SELEÇÃO DE NÍVEIS -->
    <div id="screen-levels" class="screen hy-stage hy-full hy-scroll hy-theme-vowel">
        <div class="max-w-4xl w-full">
            <div class="flex justify-between items-center mb-10">
                <button aria-label="Voltar" title="Voltar" onclick="showScreen('screen-start')" class="hy-pill-btn">← Voltar</button>
                <h2 class="hy-heading">Níveis</h2>
                <div class="w-24"></div>
            </div>
            <div id="levels-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8"></div>
        </div>
    </div>

    <!-- TELA DO JOGO -->
    <div id="screen-game" class="screen w-full">
        <div class="w-full max-w-5xl mt-4 flex flex-col h-full justify-between items-center pb-8">
            <div class="w-full flex justify-between items-center mb-8 px-4">
                <button aria-label="Voltar" title="Voltar" onclick="quitGame()" class="bg-white px-6 py-2 rounded-xl font-bold border-2 border-blue-200 text-blue-600 shadow-sm hover:bg-blue-50 transition-colors">← Voltar</button>
            </div>

            <!-- Área Principal: Imagem + Palavra -->
            <div class="flex flex-col md:flex-row items-center justify-center w-full gap-8 md:gap-16 my-auto">
                <!-- Imagem -->
                <div class="w-56 h-56 md:w-80 md:h-80 shrink-0 bg-white p-4 md:p-6 rounded-[2rem] border-4 border-blue-200 shadow-xl flex items-center justify-center">
                    <span id="display-emoji" class="text-8xl md:text-9xl select-none transition hover:scale-105">🎹</span>
                </div>

                <!-- Palavra incompleta -->
                <div class="text-6xl md:text-[6rem] font-bold text-gray-800 flex items-baseline tracking-widest mt-8 md:mt-0">
                    <span id="word-prefix"></span>
                    <span id="word-gap" class="text-transparent mx-2 relative top-[-5px]">_</span>
                    <span id="word-suffix"></span>
                </div>
            </div>

            <!-- Botões das Vogais (Teclado Virtual) -->
            <div class="w-full max-w-3xl mt-12">
                <div class="flex justify-center gap-3 md:gap-6 px-4">
                    <button id="btn-A" onclick="checkVowel('A')" class="vowel-btn flex-1 aspect-square max-w-[110px] bg-[#9333ea] text-white font-game text-5xl md:text-6xl rounded-2xl shadow-[0_8px_0_#5b21b6]">A</button>
                    <button id="btn-E" onclick="checkVowel('E')" class="vowel-btn flex-1 aspect-square max-w-[110px] bg-[#ef4444] text-white font-game text-5xl md:text-6xl rounded-2xl shadow-[0_8px_0_#b91c1c]">E</button>
                    <button id="btn-I" onclick="checkVowel('I')" class="vowel-btn flex-1 aspect-square max-w-[110px] bg-[#84cc16] text-white font-game text-5xl md:text-6xl rounded-2xl shadow-[0_8px_0_#4d7c0f]">I</button>
                    <button id="btn-O" onclick="checkVowel('O')" class="vowel-btn flex-1 aspect-square max-w-[110px] bg-[#3b82f6] text-white font-game text-5xl md:text-6xl rounded-2xl shadow-[0_8px_0_#1d4ed8]">O</button>
                    <button id="btn-U" onclick="checkVowel('U')" class="vowel-btn flex-1 aspect-square max-w-[110px] bg-[#ec4899] text-white font-game text-5xl md:text-6xl rounded-2xl shadow-[0_8px_0_#be185d]">U</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE VITÓRIA -->
    <div id="win-modal" class="fixed inset-0 hy-overlay flex items-center justify-center hidden z-50 backdrop-blur-sm">
        <div class="hy-panel max-w-sm mx-4">
            <h2 class="text-5xl font-game mb-4" style="color:#48076a" id="modal-title">NÍVEL CONCLUÍDO!</h2>
            <div class="text-8xl mb-6">🏆</div>
            <p class="text-xl font-bold text-gray-600 mb-8" id="modal-msg">Você foi incrível!</p>
            <button onclick="showScreen('screen-levels')" class="hy-cta w-full" style="--cta:#6ce67d;--cta-dark:#3db54a;animation:none">
                Continuar
            </button>
        </div>
    </div>

    <script src="../utils/audio.js"></script>
    <script src="../utils/score.js"></script>
    <script src="../utils/elapsed.js"></script>
    <script src="../utils/progress.js"></script>
    <script src="../utils/stars.js"></script>
    <script src="../utils/words.js"></script>
    <script src="main.js"></script>
</body>
</html>
